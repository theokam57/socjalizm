<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Wideo z muzyką</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
    }
    video {
      height: 100%;
      width: 100%;
      object-fit: cover;
    }
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2em;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="overlay">▶ Kliknij, aby rozpocząć</div>

  <video id="vid" loop muted>
    <source src="video.mp4" type="video/mp4">
    Twoja przeglądarka nie obsługuje wideo.
  </video>

  <audio id="audio" loop>
    <source src="audio.mp3" type="audio/mpeg">
    Twoja przeglądarka nie obsługuje audio.
  </audio>

  <script>
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('vid');
    const audio = document.getElementById('audio');

    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.play();
      audio.play();
    });
  </script>
</body>
</html>
